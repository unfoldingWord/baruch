name: Deploy Staging

# Staging follows the develop branch only: it deploys after CI succeeds on a
# push to develop. PR branches never deploy here.
# The branch filter alone is not enough: a release PR (develop → main) runs CI
# with head branch develop too, so the job also requires the CI run to have
# been triggered by a push. Otherwise each merge into develop deploys twice.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [develop]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Deploy to Staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
